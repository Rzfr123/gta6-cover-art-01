<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Coast — GTA-style Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <h1>VICE COAST <span>Cover Studio</span></h1>
  <p>Your photos become GTA-style cover art. Nothing leaves your machine.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h2>1 · Photos</h2>
    <div id="photos" class="slots"></div>
    <p class="hint">Or load the sample cast — four free photos ship with the app.</p>
    <h2>2 · Caption</h2>
    <label>Title <input id="title" type="text" maxlength="24" value="VICE COAST"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Chasing the Last Sunset"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="48" value="EVERYONE WANTS A CUT OF THE SUNSET"></label>
    <label>Press quote <input id="quote" type="text" maxlength="48" value="THE HOTTEST RIDE ON THE COAST"></label>
    <label>Quote source <input id="source" type="text" maxlength="32" value="GOLDEN COAST GAZETTE"></label>
    <h2>3 · Layout</h2>
    <div id="layouts" class="opts"></div>
    <h2>4 · Grade</h2>
    <div id="grades" class="opts"></div>
    <h2>5 · Size</h2>
    <div id="sizes" class="opts"></div>
    <button id="export" type="button" class="primary">Export PNG</button>
    <button id="exportAll" type="button">Export all 3 sizes</button>
    <p id="status" role="status"></p>
  </section>
  <section class="stage" aria-label="Live preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
    <div class="panel-editor" aria-label="Selected panel">
      <strong id="panelLabel">Panel 1</strong>
      <label>Role tag <input id="panelTag" type="text" maxlength="18" value="THE DRIVER"></label>
      <label>Photo <select id="panelPhoto"></select></label>
      <label>Zoom <input id="panelZoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Shift X <input id="panelX" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
      <label>Shift Y <input id="panelY" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
      <p class="hint">Click a panel to pick it. Drag its photo to move it.</p>
    </div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
